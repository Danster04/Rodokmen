        h1 { margin: 0; font-size: 1.4rem; }

    <header>
        <h1>Můj rodokmen – interaktivní síť</h1>
        <span>Zdroj: <a href="dnes.ged" target="_blank" style="color: #3498db;">dnes.ged</a></span>
    </header>

    <div id="canvas">
        <div id="loading">Načítám data...</div>

    </div>

<script>
fetch('dnes.ged')
    .then(response => {
        if (!response.ok) throw new Error("Nepodařilo se načíst dnes.ged");
        return response.text();
    })
    .then(data => {
        processGedcomData(data);
    })
    .catch(error => {
        document.getElementById('loading').innerText = "Chyba: " + error.message;
        document.getElementById('loading').style.color = "red";
    });

function processGedcomData(text) {
    const lines = text.split(/\r?\n/);
    let individuals = {};
    let families = {};
    let currentId = null;
    let currentType = null;
    let currentFamilyId = null;

    lines.forEach(line => {
        const match = line.match(/^([0-9])\s+(@\w+@|[A-Z_]+)\s*(.*)$/);
        if (!match) return;

        const level = parseInt(match[1]);
        const key = match[2];
        const val = match[3];

        if (level === 0) {
            if (key.startsWith('@') && key.endsWith('@')) {
                if (val === 'INDI') {
                    currentId = key;
                    individuals[currentId] = { id: currentId, name: 'Neznámý' };
                    currentFamilyId = null;
                    currentType = 'INDI';
                } else if (val === 'FAM') {
                    currentFamilyId = key;
                    families[currentFamilyId] = { id: currentFamilyId, husb: null, wife: null, children: [] };
                    currentId = null;
                    currentType = 'FAM';
                } else {
                    currentId = null;
                    currentFamilyId = null;
                    currentType = null;
                }
            }
        } else if (level === 1) {
            if (currentType === 'INDI' && key === 'NAME') {
                individuals[currentId].name = val.replace(/\//g, '').trim();
            } else if (currentType === 'FAM') {
                if (key === 'HUSB') families[currentFamilyId].husb = val.trim();
                if (key === 'WIFE') families[currentFamilyId].wife = val.trim();
                if (key === 'CHIL') families[currentFamilyId].children.push(val.trim());
            }
        }
    });

    let nodesMap = {};
    Object.values(individuals).forEach(p => {
        if (p.name !== 'Neznámý') {
            nodesMap[p.id] = { id: p.id, name: p.name };
        }
    });

    let links = [];
    Object.values(families).forEach(fam => {
        let parents = [fam.husb, fam.wife].filter(p => p && nodesMap[p]);
        let kids = fam.children.filter(c => nodesMap[c]);

        // Propojení rodičů s dětmi
        parents.forEach(parent => {
            kids.forEach(child => {
                links.push({ source: parent, target: child });
            });
        });
    });

    let nodes = Object.values(nodesMap);

    document.getElementById('loading').style.display = 'none';
    drawNetwork(nodes, links);
}

function drawNetwork(nodes, links) {
    const svg = d3.select("#tree-svg");
    const width = document.getElementById('canvas').clientWidth;
    const height = document.getElementById('canvas').clientHeight;

    svg.selectAll("*").remove();

    const g = svg.append("g");

    // Zoomování a posouvání myší
    svg.call(d3.zoom().on("zoom", (event) => {
        g.attr("transform", event.transform);
    }));

    const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(80))
        .force("charge", d3.forceManyBody().strength(-200))
        .force("center", d3.forceCenter(width / 2, height / 2))
        .force("collision", d3.forceCollide().radius(30));

    const link = g.append("g")
        .selectAll("line")
        .data(links)
        .enter().append("line")
        .attr("class", "link");

    const node = g.append("g")
        .selectAll("g")
        .data(nodes)
        .enter().append("g")
        .attr("class", "node")
        .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended));

    node.append("circle")
        .attr("r.variable", 8)
        .attr("r", 8);

    node.append("text")
        .text(d => d.name)
        .attr("y", -12);

    simulation.on("tick", () => {
        link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

        node
            .attr("transform", d => `translate(${d.x}, ${d.y})`);
    });

        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
    }

    function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
